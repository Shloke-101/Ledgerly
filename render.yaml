services:
  # ============================================================================
  # Backend FastAPI Web Service
  # ============================================================================
  - type: web
    name: ledgerly-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "./render_build.sh"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerly-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ledgerly-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  # ============================================================================
  # Background Celery Worker
  # ============================================================================
  - type: worker
    name: ledgerly-celery-worker
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "./render_build.sh"
    startCommand: "celery -A app.celery_app.celery_app worker --loglevel=INFO"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerly-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: ledgerly-redis
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

  # ============================================================================
  # Frontend Static Site (Vite React App)
  # ============================================================================
  - type: web
    name: ledgerly-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ledgerly-backend
          property: url

  # ============================================================================
  # Redis Cache & Message Broker
  # ============================================================================
  - type: redis
    name: ledgerly-redis
    plan: free
    ipAllowList: [] # internal access only

# ==============================================================================
# Managed PostgreSQL Database
# ==============================================================================
databases:
  - name: ledgerly-db
    plan: free
    databaseName: ledgerly
    user: ledgerly
    ipAllowList: [] # internal access only
